server {
    listen 80;
    listen [::]:80;
    server_name simulateur.innoveagroup.tech;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name simulateur.innoveagroup.tech;

    root /var/www/simulsolaire;
    index index.html;

    ssl_certificate     /etc/letsencrypt/live/simulateur.innoveagroup.tech/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/simulateur.innoveagroup.tech/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    gzip on;
    gzip_comp_level 6;
    gzip_types text/css application/javascript application/json image/svg+xml;

    add_header Service-Worker-Allowed "/" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Strict-Transport-Security "max-age=31536000" always;

    # Manifest PWA
    location = /manifest.json {
        default_type application/manifest+json;
        expires 1h;
        add_header Cache-Control "public, no-cache";
        add_header Service-Worker-Allowed "/";
    }

    # Service Worker
    location = /sw.js {
        expires 1h;
        add_header Cache-Control "public, no-cache";
        add_header Service-Worker-Allowed "/";
    }

    # Assets statiques
    location ~* \.(js|css|svg|ico|woff2?)$ {
        expires 1M;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    error_page 404 /index.html;

    access_log /var/log/nginx/simulsolaire_access.log;
    error_log  /var/log/nginx/simulsolaire_error.log warn;
}
