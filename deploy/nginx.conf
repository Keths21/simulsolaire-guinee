# Redirection HTTP → HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name simulateur.innoveagroup.tech;

    # Validation Certbot Let's Encrypt
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# Serveur principal HTTPS
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name simulateur.innoveagroup.tech;

    root /var/www/simulsolaire;
    index index.html;

    # ── SSL (rempli par Certbot) ──────────────────────────────
    ssl_certificate     /etc/letsencrypt/live/simulateur.innoveagroup.tech/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/simulateur.innoveagroup.tech/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    # ── GZIP ─────────────────────────────────────────────────
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/html text/css application/javascript
               application/json image/svg+xml text/plain;

    # ── EN-TÊTES SÉCURITÉ + PWA ───────────────────────────────
    add_header Service-Worker-Allowed   "/"                               always;
    add_header X-Content-Type-Options   "nosniff"                         always;
    add_header X-Frame-Options          "SAMEORIGIN"                      always;
    add_header Referrer-Policy          "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy       "camera=(), microphone=()"        always;

    # ── TYPES MIME ────────────────────────────────────────────
    types {
        application/manifest+json   json;
        image/svg+xml               svg svgz;
    }

    # ── CACHE assets statiques ────────────────────────────────
    location ~* \.(js|css|svg|ico|woff2?)$ {
        expires 1M;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # ── Manifest + SW : cache court (mises à jour PWA) ────────
    location ~* (manifest\.json|sw\.js)$ {
        expires 1h;
        add_header Cache-Control "public, no-cache";
        add_header Service-Worker-Allowed "/";
    }

    # ── HTML ──────────────────────────────────────────────────
    location ~* \.html$ {
        expires 1h;
        add_header Cache-Control "public";
    }

    # ── Route principale ──────────────────────────────────────
    location / {
        try_files $uri $uri/ /index.html;
    }

    error_page 404 /index.html;

    # ── Logs ──────────────────────────────────────────────────
    access_log /var/log/nginx/simulsolaire_access.log;
    error_log  /var/log/nginx/simulsolaire_error.log warn;
}
